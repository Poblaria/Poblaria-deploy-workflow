---
name: Poblaria Deployment
run-name: "[Deploy] ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
# TODO: re-enable once stable
#        branches:
#            - main
#        tags:
#            - 'v*'

env:
  DEPLOY_PATH: ~/apps/poblaria

jobs:
  build-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ backend, frontend ]
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      - name: Get current date # get the date of the build
        id: date
        run: echo "::set-output name=date::$(date +%s)"

      - name: Build the Docker image
        run: docker build . --file Dockerfile  --tag ghcr.io/poblaria/${{ matrix.project }}:${{ steps.date.outputs.date }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the Docker image to the GitHub registry
        run: docker push ghcr.io/poblaria/${{ matrix.project }}:${{ steps.date.outputs.date }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push-image

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add remote server to known_hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # TODO: must Docker Compose be on remote server, way to do it different?
      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}
            sed -i 's/^DOCKER_TAG=.*/DOCKER_TAG=${{ needs.build-push-image.outputs.date }}/' .env
            docker compose up -d
          EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

